<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#000000"/>
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blurWide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blurNarrow"/>
      <feMerge>
        <feMergeNode in="blurWide"/>
        <feMergeNode in="blurNarrow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="90" y="130" font-family="Orbitron, Arial, sans-serif" font-size="118" font-weight="900" text-anchor="middle" fill="#22d3ee" filter="url(#neonGlow)">R</text>
</svg>
